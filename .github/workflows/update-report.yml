name: Sync 8BRUH report

on:
  workflow_dispatch:
  repository_dispatch:
    types:
      - 8bruh_report_ready
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-report.yml"
  schedule:
    # Резервная синхронизация по понедельникам каждые 10 минут
    # с 15:00 до 23:50 по Астане (UTC+5).
    # Основной путь после настройки Worker: repository_dispatch сразу после Cron.
    - cron: "*/10 10-18 * * 1"

permissions:
  contents: write

concurrency:
  group: sync-8bruh-report
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare and validate report
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_REPORT: ${{ toJson(github.event.client_payload.report) }}
          SOURCE_URL: https://8bruh-war-report.adisonstark.workers.dev/report
        shell: bash
        run: |
          set -euo pipefail

          tmp_file="$(mktemp)"

          if [[ "$EVENT_NAME" == "repository_dispatch" ]]; then
            echo "Using report delivered by Cloudflare Worker."
            printf '%s' "$DISPATCH_REPORT" > "$tmp_file"
          else
            echo "Using backup pull from Cloudflare Worker."

            curl               --fail               --silent               --show-error               --location               --retry 5               --retry-all-errors               --retry-delay 10               --connect-timeout 20               --max-time 90               "$SOURCE_URL"               --output "$tmp_file"
          fi

          # Проверяем структуру исходного отчёта.
          jq -e '
            (.generatedAt | type == "string") and
            (.leader10Weeks | type == "object") and
            (.leader10Weeks.name | type == "string") and
            (.leader10Weeks.points | type == "number") and
            (.heroesLastWeek | type == "array") and
            (.underplayedLastWeek | type == "array")
          ' "$tmp_file" > /dev/null

          # Принимаем только отчёт текущего дня по времени Астаны.
          # До появления свежего понедельничного отчёта резервные запуски
          # завершаются без ошибки и не перезаписывают report.json старыми данными.
          set +e
          python3 - "$tmp_file" <<'PY'
          import datetime as dt
          import json
          import sys
          from zoneinfo import ZoneInfo

          path = sys.argv[1]

          with open(path, "r", encoding="utf-8") as file:
              data = json.load(file)

          generated_at = data["generatedAt"]
          generated = dt.datetime.fromisoformat(
              generated_at.replace("Z", "+00:00")
          )

          astana = ZoneInfo("Asia/Almaty")
          generated_local = generated.astimezone(astana)
          now_local = dt.datetime.now(dt.timezone.utc).astimezone(astana)

          if generated_local.date() != now_local.date():
              print(
                  "Report is not from today in Asia/Almaty: "
                  f"generatedAt={generated_at}, "
                  f"generated_local={generated_local.isoformat()}, "
                  f"today={now_local.date()}"
              )
              raise SystemExit(42)

          print(
              "Fresh report accepted: "
              f"generatedAt={generated_at}, "
              f"local={generated_local.isoformat()}"
          )
          PY
          freshness_status=$?
          set -e

          if [[ "$freshness_status" -eq 42 ]]; then
            echo "Fresh report is not available yet. Keeping current report.json."
            exit 0
          fi

          if [[ "$freshness_status" -ne 0 ]]; then
            exit "$freshness_status"
          fi

          # Публичное зеркало: сохраняем только нужные для постера поля
          # и данные для проверки свежести. underplayedLastWeek переносится
          # целиком, включая игроков с 0 использованных колод.
          jq '{
            source: (.source // null),
            generatedAt,
            latestWar: (.latestWar // null),
            leader10Weeks,
            heroesLastWeek,
            underplayedLastWeek
          }' "$tmp_file" > report.json

          jq -e '
            (.generatedAt | type == "string") and
            (.leader10Weeks | type == "object") and
            (.heroesLastWeek | type == "array") and
            (.underplayedLastWeek | type == "array")
          ' report.json > /dev/null

          echo "Prepared report.json:"
          jq . report.json

      - name: Commit updated mirror
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add report.json

          if git diff --cached --quiet; then
            echo "Report has not changed."
            exit 0
          fi

          git commit -m "Update 8BRUH report"
          git push
