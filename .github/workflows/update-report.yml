name: Mirror 8BRUH report

on:
  workflow_dispatch:
  schedule:
    # Понедельник, каждые 30 минут с 15:00 до 23:30 по Астане (UTC+5)
    - cron: "*/30 10-18 * * 1"

permissions:
  contents: write

concurrency:
  group: mirror-8bruh-report
  cancel-in-progress: true

jobs:
  mirror:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download and validate report
        env:
          SOURCE_URL: https://8bruh-war-report.adisonstark.workers.dev/report
        shell: bash
        run: |
          set -euo pipefail

          tmp_file="$(mktemp)"

          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --retry 5 \
            --retry-all-errors \
            --retry-delay 10 \
            --connect-timeout 20 \
            --max-time 90 \
            "$SOURCE_URL" \
            --output "$tmp_file"

          # Проверка обязательных полей исходного отчёта
          jq -e '
            (.generatedAt | type == "string") and
            (.leader10Weeks | type == "object") and
            (.leader10Weeks.name | type == "string") and
            (.leader10Weeks.points | type == "number") and
            (.heroesLastWeek | type == "array") and
            (.underplayedLastWeek | type == "array")
          ' "$tmp_file" > /dev/null

          # Проверка свежести отчёта
          python3 - "$tmp_file" <<'PY'
          import datetime as dt
          import json
          import sys

          path = sys.argv[1]

          with open(path, "r", encoding="utf-8") as file:
              data = json.load(file)

          generated_at = data["generatedAt"]
          generated = dt.datetime.fromisoformat(
              generated_at.replace("Z", "+00:00")
          )
          now = dt.datetime.now(dt.timezone.utc)
          age = now - generated

          if age.total_seconds() < -300:
              raise SystemExit(
                  f"Report timestamp is in the future: generatedAt={generated_at}"
              )

          if age > dt.timedelta(hours=72):
              raise SystemExit(
                  f"Report is stale: generatedAt={generated_at}, age={age}"
              )
          PY

          # Создаём публичное зеркало только с нужными полями.
          # В underplayedLastWeek оставляем только игроков с 1–15 использованными колодами.
          # Игроки с 0/16 исключаются как потенциальные новички.
          jq '{
            source: (.source // null),
            generatedAt,
            leader10Weeks,
            heroesLastWeek,
            underplayedLastWeek: [
              .underplayedLastWeek[]
              | select(
                  (.decksUsed | type == "number")
                  and (.decksUsed >= 1)
                  and (.decksUsed <= 15)
                )
            ]
          }' "$tmp_file" > report.json

          # Финальная проверка созданного зеркала
          jq -e '
            (.generatedAt | type == "string") and
            (.leader10Weeks | type == "object") and
            (.heroesLastWeek | type == "array") and
            (.underplayedLastWeek | type == "array") and
            (
              all(
                .underplayedLastWeek[];
                (.decksUsed | type == "number")
                and (.decksUsed >= 1)
                and (.decksUsed <= 15)
              )
            )
          ' report.json > /dev/null

          echo "Prepared report.json:"
          jq . report.json

      - name: Commit updated mirror
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add report.json

          if git diff --cached --quiet; then
            echo "Report has not changed."
            exit 0
          fi

          git commit -m "Update 8BRUH report"
          git push
